name: Hyper Agents Force PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  pr-review:
    if: github.event_name == 'pull_request' || contains(github.event.comment.body, '/meet review') || contains(github.event.comment.body, '/meet audit')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Hyper Agents Force Review Bot
        run: |
          python bin/ci_bot.py

      - name: Post Review Comment to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const commentPath = '.agent/context/PR_REVIEW_COMMENT.md';
            if (fs.existsSync(commentPath)) {
              const body = fs.readFileSync(commentPath, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
